name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The record is valid, the views are current, and the checker catches each fault
        run: python3 -m unittest discover -s tests -v
      - name: README.md and PRODUCTS.md match checklist.json
        run: python3 scripts/render.py --check
